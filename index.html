<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07110e">
<meta name="description" content="Cruelben — Bruno's corner of the internet. COBOL survivor, cryptography systems and technology enthusiast.">
<title>Cruelben | Digital Corner</title>
<link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/44285318?s=60&v=4">
<style>
:root{--bg:#07110e;--panel:rgba(13,27,22,.82);--green:#00ff9d;--green2:#7dffc6;--muted:#a3b8ad;--line:rgba(0,255,157,.2)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#eefbf4;background:radial-gradient(ellipse at 50% 0%,#123628 0%,#091711 43%,#050a08 100%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:36px 18px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,255,157,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,157,.035) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
.glow{position:fixed;width:460px;height:460px;border-radius:50%;background:rgba(0,255,157,.08);filter:blur(100px);top:10%;left:calc(50% - 230px);pointer-events:none}
.page{position:relative;width:min(100%,980px);z-index:1}

/* TOPBAR ora centrata e con elementi vicini */
.topbar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px;padding:0 4px;text-decoration:none;width:fit-content;margin-left:auto;margin-right:auto;transition:transform .25s}
.topbar:hover{transform:translateY(-1px)}
.brand{font-size:.82rem;letter-spacing:.22em;text-transform:uppercase;color:var(--green);font-weight:800;white-space:nowrap}
.brand span{color:#e9fff4}
.avatar-mini{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--green);box-shadow:0 0 20px rgba(0,255,157,.22);transition:transform .25s;flex-shrink:0}
.topbar:hover .avatar-mini{transform:scale(1.07)}

.avatar-panel{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;padding:8px 0}
.avatar-frame{position:relative;width:min(100%,620px);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,255,157,.26);border-radius:24px;background:radial-gradient(circle at 50% 46%,rgba(0,255,157,.12),rgba(0,0,0,.14) 60%),rgba(0,0,0,.18);overflow:hidden;box-shadow:inset 0 0 60px rgba(0,255,157,.045),0 0 42px rgba(0,255,157,.045)}
.avatar-frame:before,.avatar-frame:after{content:"";position:absolute;inset:14px;border:1px solid rgba(0,255,157,.1);border-radius:16px;pointer-events:none}
.avatar-frame:after{inset:0;border:0;border-radius:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 4px,rgba(0,0,0,.12) 5px);pointer-events:none}
#avatarCanvas{display:block;width:100%;height:100%;position:relative;z-index:1;cursor:pointer;touch-action:manipulation;outline:none}
#avatarCanvas:focus-visible{outline:2px solid var(--green);outline-offset:-8px;border-radius:20px}

.avatar-label{display:flex;align-items:center;gap:8px;color:#91b8a3;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;margin-top:18px;background:none;border:0;padding:8px 14px;cursor:pointer;border-radius:10px;font-family:inherit;transition:color .25s,background .25s}
.avatar-label:hover{color:var(--green);background:rgba(0,255,157,.06)}
.avatar-label:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.equalizer{height:14px;display:flex;align-items:center;gap:3px}
.equalizer i{display:block;width:3px;height:5px;background:var(--green);border-radius:3px}
.speaking .equalizer i{animation:bars .45s ease-in-out infinite alternate}
.speaking .equalizer i:nth-child(2){animation-delay:.1s}
.speaking .equalizer i:nth-child(3){animation-delay:.2s}
.speaking .equalizer i:nth-child(4){animation-delay:.06s}
@keyframes bars{to{height:14px}}
.footer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 5px 0;color:#6f8a7a;font-size:.76rem;letter-spacing:.04em}
.footer a{color:#9fc8b1;text-decoration:none}
.footer a:hover{color:var(--green)}
@media(max-width:760px){
  body{padding:18px 12px}
  .avatar-frame{width:min(100%,460px)}
  .avatar-label{margin-top:12px;font-size:.68rem}
  .footer{align-items:flex-start;flex-direction:column}
  .topbar{margin-bottom:15px}
  .avatar-mini{width:40px;height:40px}
  .brand{font-size:.72rem}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="page">
  <a class="topbar" href="https://github.com/cruelben" target="_blank" rel="noopener noreferrer" aria-label="Open Cruelben's GitHub profile">
    <img class="avatar-mini" src="https://avatars.githubusercontent.com/u/44285318?v=4" alt="Bruno's GitHub profile picture">
    <div class="brand">CRUEL<span>BEN</span> <span style="color:#729282">/ DIGITAL CORNER</span></div>
  </a>

  <div class="avatar-panel" id="avatarPanel">
    <div class="avatar-frame">
      <canvas id="avatarCanvas" width="420" height="420" role="button" tabindex="0" aria-label="Talk with Bruno’s animated avatar" title="Talk with me"></canvas>
    </div>
    <button class="avatar-label" id="talkBtn" type="button" aria-label="Start talking">
      <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="avatarStatus">Talk with me</span>
    </button>
  </div>

  <footer class="footer">
    <span>© <span id="year"></span> Bruno “Cruelben” Benevolo</span>
    <span>Built with curiosity, code &amp; a little green glow.</span>
  </footer>
</main>
<script>
(() => {
  const canvas = document.getElementById('avatarCanvas');
  const ctx = canvas.getContext('2d');
  const panel = document.getElementById('avatarPanel');
  const status = document.getElementById('avatarStatus');
  const talkBtn = document.getElementById('talkBtn');

  const GITHUB_URL = 'https://github.com/cruelben';

  // Testo letto dall'avatar (in inglese)
  const intro = "Hello, my name is Bruno, aka cruelben—don't ask me why. I'm a COBOL survivor, a cryptography systems enthusiast, and a curious mind exploring the world of technology. Take a look at my GitHub and see what I'm working on.";

  let t = 0, speaking = false, mouth = 0, targetMouth = 0, blink = 0, blinkTimer = 150, utterance = null;
  let redirecting = false;

  const particles = Array.from({length:42}, () => ({
    x: Math.random()*420, y: Math.random()*420,
    r: Math.random()*2+0.5, s: Math.random()*0.45+0.12,
    a: Math.random()*0.55+0.15, p: Math.random()*6.28
  }));

  function line(x1,y1,x2,y2,alpha=1){
    ctx.strokeStyle=`rgba(0,255,157,${alpha})`;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  function draw(){
    const w=canvas.width,h=canvas.height;
    ctx.clearRect(0,0,w,h);
    t+=0.018;

    particles.forEach(p=>{
      p.y-=p.s;
      p.p+=.018;
      p.x+=Math.sin(p.p)*.25;
      if(p.y<0){p.y=h;p.x=Math.random()*w}
      ctx.globalAlpha=p.a;
      ctx.fillStyle='#00ff9d';
      ctx.shadowBlur=10;
      ctx.shadowColor='#00ff9d';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.shadowBlur=0;

    const cx=210,cy=205,breath=Math.sin(t*1.6)*2;
    const halo=ctx.createRadialGradient(cx,cy,30,cx,cy,180);
    halo.addColorStop(0, speaking?'rgba(0,255,157,.17)':'rgba(0,255,157,.075)');
    halo.addColorStop(1,'rgba(0,255,157,0)');
    ctx.fillStyle=halo;
    ctx.fillRect(0,0,w,h);

    // Head outline
    ctx.save();
    ctx.translate(0,breath);
    ctx.shadowBlur=20;
    ctx.shadowColor='rgba(0,255,157,.42)';
    ctx.strokeStyle='#00ff9d';
    ctx.lineWidth=2.6;
    ctx.beginPath();
    ctx.moveTo(125,145);
    ctx.quadraticCurveTo(135,85,210,82);
    ctx.quadraticCurveTo(285,85,295,145);
    ctx.lineTo(287,242);
    ctx.quadraticCurveTo(278,296,210,310);
    ctx.quadraticCurveTo(142,296,133,242);
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur=0;

    // Inner contour
    ctx.strokeStyle='rgba(0,255,157,.38)';
    ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(143,150);
    ctx.quadraticCurveTo(150,105,210,102);
    ctx.quadraticCurveTo(270,105,277,150);
    ctx.stroke();

    // Side panels
    ctx.strokeStyle='rgba(0,255,157,.72)';
    ctx.lineWidth=2;
    ctx.strokeRect(112,170,18,48);
    ctx.strokeRect(290,170,18,48);
    line(115,181,125,181,.9);
    line(295,181,305,181,.9);

    // Eyes
    blinkTimer--;
    if(blinkTimer<=0){blink=5;blinkTimer=125+Math.random()*150}
    if(blink>0)blink--;
    ctx.shadowBlur=13;
    ctx.shadowColor='#00ff9d';
    ctx.strokeStyle='#00ff9d';
    ctx.lineWidth=3;
    if(blink>0){
      line(157,181,190,181);
      line(230,181,263,181);
    } else {
      ctx.fillStyle='#00ff9d';
      ctx.beginPath();
      ctx.moveTo(157,172);ctx.lineTo(190,172);ctx.lineTo(185,193);ctx.lineTo(162,193);
      ctx.closePath();ctx.fill();
      ctx.beginPath();
      ctx.moveTo(230,172);ctx.lineTo(263,172);ctx.lineTo(258,193);ctx.lineTo(235,193);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#062016';
      ctx.fillRect(169,176,9,12);
      ctx.fillRect(242,176,9,12);
    }
    ctx.shadowBlur=0;

    // Nose
    ctx.strokeStyle='rgba(0,255,157,.55)';
    ctx.lineWidth=1.7;
    ctx.beginPath();
    ctx.moveTo(210,191);
    ctx.lineTo(203,218);
    ctx.lineTo(215,220);
    ctx.stroke();

    // Mouth
    mouth+=(targetMouth-mouth)*.32;
    const open= speaking?Math.max(mouth,0.07+Math.abs(Math.sin(t*8))*.18):0;
    ctx.strokeStyle='#00ff9d';
    ctx.lineWidth=2.5;
    ctx.shadowBlur=14;
    ctx.shadowColor='#00ff9d';
    if(open<.09){
      ctx.beginPath();
      ctx.moveTo(177,245);
      ctx.quadraticCurveTo(210,250,243,245);
      ctx.stroke();
    } else {
      ctx.fillStyle='rgba(0,15,9,.92)';
      ctx.beginPath();
      ctx.ellipse(210,245,31,5+open*29,0,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
      if(open>.28){
        ctx.fillStyle='rgba(0,255,157,.65)';
        ctx.beginPath();
        ctx.ellipse(210,245+open*5,17,2+open*8,0,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.shadowBlur=0;

    // Circuit marks & collar
    line(149,264,166,279,.55);
    line(166,279,183,279,.55);
    line(271,264,254,279,.55);
    line(254,279,237,279,.55);
    line(185,291,235,291,.7);
    line(192,300,228,300,.4);
    ctx.restore();

    // HUD corners
    ctx.strokeStyle='rgba(0,255,157,.55)';
    ctx.lineWidth=2;
    line(25,48,25,25);
    line(25,25,48,25);
    line(372,25,395,25);
    line(395,25,395,48);
    line(25,372,25,395);
    line(25,395,48,395);
    line(372,395,395,395);
    line(395,372,395,395);

    ctx.fillStyle='rgba(0,255,157,.65)';
    ctx.font='11px monospace';
    ctx.textAlign='left';
    ctx.fillText('CB-01',39,45);
    ctx.textAlign='right';
    ctx.fillText(speaking?'VOICE ACTIVE':'SYSTEM READY',381,386);

    requestAnimationFrame(draw);
  }

  function stopSpeech(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    speaking=false;
    targetMouth=0;
    panel.classList.remove('speaking');
    status.textContent='Talk with me';
  }

  function goToGitHub(){
    if(redirecting) return;
    redirecting = true;
    status.textContent='Redirecting to GitHub…';
    setTimeout(() => { window.location.href = GITHUB_URL; }, 450);
  }

  function speak(){
    if(!('speechSynthesis' in window)){
      status.textContent='Speech synthesis is not supported by this browser';
      return;
    }
    if(speaking){stopSpeech();return}
    window.speechSynthesis.cancel();
    utterance=new SpeechSynthesisUtterance(intro);
    utterance.lang='en-US';
    utterance.rate=.93;
    utterance.pitch=1.05;
    utterance.volume=1;

    utterance.onstart=()=>{
      speaking=true;
      panel.classList.add('speaking');
      status.textContent='Speaking · English';
    };
    utterance.onboundary=(e)=>{
      if(e.name==='word'){
        targetMouth=.35+Math.random()*.65;
        setTimeout(()=>{targetMouth=.08+Math.random()*.16},130);
      }
    };
    utterance.onend=()=>{
      speaking=false;
      targetMouth=0;
      panel.classList.remove('speaking');
      status.textContent='Introduction complete · opening GitHub';
      setTimeout(goToGitHub, 500);
    };
    utterance.onerror=()=>{
      stopSpeech();
      status.textContent='Speech could not start — check your browser voice settings';
    };
    window.speechSynthesis.speak(utterance);
  }

  canvas.addEventListener('click', speak);
  canvas.addEventListener('keydown', (event) => {
    if(event.key === 'Enter' || event.key === ' '){
      event.preventDefault();
      speak();
    }
  });

  talkBtn.addEventListener('click', speak);

  window.addEventListener('beforeunload', () => {
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
  });

  document.getElementById('year').textContent = new Date().getFullYear();
  draw();
})();
</script>
</body>
</html>
